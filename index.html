<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#075C45" />
    <meta
      name="description"
      content="Ibolya Könyvelés – könyvelési, bérszámfejtési és ügyviteli támogatás magyar nyelven."
    />
    <title>Ibolya Könyvelés | Megbízható szakmai támogatás</title>
    <style>
      #startup-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #f7f3eb;
        color: #033d2e;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #startup-screen > div {
        width: min(560px, 100%);
        padding: 2rem;
        border: 1px solid #c9a45a;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(3, 61, 46, 0.12);
      }

      #startup-screen p {
        color: #65756e;
        line-height: 1.6;
      }

      #startup-screen strong {
        color: #075c45;
      }

      #startup-screen code {
        display: inline-block;
        padding: 0.2rem 0.45rem;
        border-radius: 6px;
        background: #f2dfac;
        color: #033d2e;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="startup-screen" role="status">
        <div>
          <p><strong>Ibolya Könyvelés</strong></p>
          <h1>A fejlesztői szerver még nem fut.</h1>
          <p>Ez egy Vite + React projekt, ezért az <code>index.html</code> közvetlen Live Serveres megnyitása nem indítja el az alkalmazást.</p>
          <p>Terminálban futtasd: <code>npm install</code>, majd <code>npm run dev</code>, és nyisd meg a Vite által kiírt helyi címet.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
